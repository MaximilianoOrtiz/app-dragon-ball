<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsule Store</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
    
</head>
<body>

  <!-- Puntos de montaje para componentes comunes --> 
  <div id="site-header"></div >
  

  <main> 
    <section id="site-hero"></section>

    <div class="main__container">
      
      <h1 class="page-title">Top vistos recientemente</h1>
      <section id="results-container" class="results-grid"></section>

      <section id="site-benefits"></section>
  
    </div>
  </main>

  <!-- Navegacion mobile -->
  <div id="site-nav"></div>

  <!-- Footer desktop -->
   <div id="site-footer"></div>


  <!-- Componentes: siempre antes de main.js --> 
  <script src="./js/components/bottom-nav.js"></script>
  <script src="./js/components/header.js"></script>
  <script src="./js/components/footer.js"></script>
  <script src="./js/components/card.js" ></script>
  <script src="./js/components/home/hero.js" ></script>
  <script src="./js/components/home/benefits.js" ></script>

  
    
  <!-- Utilidades -->
  <script src="./js/api/api.js"></script>
  <script src="./js/utils/router.js"></script>
  <script src="./js/utils/recently-viewed-util.js"></script>
  <script src="./js/utils/local-storage-util.js"></script>
  

  <!-- Controlador: siempre antes del script de la vista --> 
  <script src="./js/main.js"></script>

  <!-- Lógica específica de esta vista -->
  <!-- TODO: En el index iria la vista del Home -->
   <script src="./js/pages/index.js"></script>
  

  <!-- pwa-init.js siempre al final --> 
  <script src="/js/pwa-init.js"></script>
</body>
</html>
