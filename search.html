<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>
<body>

 <!-- Puntos de montaje para componentes comunes --> 
    <div id="site-header"></div >

 
  <main> 
       <h1>Buscador de Personajes</h1>

    <!-- 1. Formulario de Búsqueda y Filtros -->
    <form id="search-form">
      <input type="text" id="input-name" placeholder="Nombre (ej. Goku)" />

      <select id="select-race">
        <option value="">Todas las razas</option>
        <option value="Saiyan">Saiyan</option>
        <option value="Human">Humano</option>
        <option value="Namekian">Namekiano</option>
        <option value="Android">Androide</option>
        <option value="Frieza Race">Raza de Freezer</option>
      </select>

      <select id="select-gender">
        <option value="">Todos los géneros</option>
        <option value="Male">Masculino</option>
        <option value="Female">Femenino</option>
      </select>

      <button type="submit">Buscar</button>
    </form>

    <hr />

    <!-- 2. Mensaje de estado (Cargando / Sin resultados) -->
    <div id="status-message"></div>

    <!-- 3. Contenedor donde se cargarán las tarjetas de personajes -->
    <div id="results-container"></div>

    <hr />

    <!-- 4. Controles de Paginación -->
    <div id="pagination-container">
      <button id="btn-prev" disabled>Anterior</button>
      <span id="page-info">Página 1</span>
      <button id="btn-next" disabled>Siguiente</button>
    </div>

  </main>

   <!-- Navegacion mobile -->
  <div id="site-nav"></div>

  <!-- Footer desktop -->
   <div id="site-footer"></div>

  <!-- Componentes: siempre antes de main.js --> 
  <script src="./js/components/bottom-nav.js"></script>
  <script src="./js/components/header.js"></script>
  <script src="./js/components/footer.js"></script>
  <script src="./js/components/card.js"></script>
    
  <!-- Utilidades -->
  <script src="./js/api/api.js"></script>
  <script src="./js/utils/router.js"></script>

  <!-- Controlador: siempre antes del script de la vista --> 
  <script src="./js/main.js"></script>

  <!-- Lógica específica de esta vista -->
   <script src="./js/pages/search.js"></script>
   <script src="./js/utils/local-storage-util.js"></script>

</body>
</html>
