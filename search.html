<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.png">
</head>
<body>

 <!-- Puntos de montaje para componentes comunes --> 
    <div id="site-header"></div >

 
  <main class="main__container"> 
       <h1>Buscador de Figuras</h1>

    <!-- 1. Formulario de Búsqueda y Filtros -->
    <form id="search-form"  class="search-card">

      <div class="form-group">
      <label for="input-name">Nombre</label>
      <input type="text" id="input-name" placeholder="Nombre (ej. Goku)" />
</div>

      <div class="form-group">
      <div class="search-form__row"></div>
      <label for="select-race">Raza</label>
      <select id="select-race">
        <option value="">Todas las razas</option>
        <option value="Saiyan">Saiyan</option>
        <option value="Human">Humano</option>
        <option value="Namekian">Namekiano</option>
        <option value="Majin">Majin</option>
        <option value="Android">Androide</option>
        <option value="Frieza Race">Raza de Freezer</option>
        <option value="Jiren Race">Raza de Jiren</option>
        <option value="God">Dios</option>
        <option value="Angel">Ángel</option>
        <option value="Evil">Maligno</option>
        <option value="Nucleico">Nucleico</option>
        <option value="Nucleioco benigno">Nucleico Benigno</option>
        <option value="Unknown">Unknown</option>
      </select>
      </div>

      <div class="form-group">
        <label for="select-gender">Género</label>
        <select id="select-gender">        
          <option value="">Todos los géneros</option>
          <option value="Male">Masculino</option>
          <option value="Female">Femenino</option>
        </select>
      </div>

      <div class="form-group">
        <label for="select-affiliation">Afiliación</label>
      <select id="select-affiliation">        
        <option value="">Todas las afiliaciones</option>
        <option value="Z Fighter">Guerrero Z</option>
        <option value="Red Ribbon Army">Ejército de la Cinta Roja</option>
        <option value="Namekian Warrior">Guerrero Namekiano</option>
        <option value="Freelancer">Independiente</option>
        <option value="Army of Frieza">Ejército de Freezer</option>
        <option value="Pride Troopers">Guerreros del Orgullo</option>
        <option value="Assistant of Vermoud">Asistente de Vermoud</option>
        <option value="God">Dios</option>
        <option value="Assistant of Beerus">Asistente de Beerus</option>
        <option value="Villain">Villano</option>
        <option value="Other">Otra</option>
      </select>
      </div>

      <button type="submit" class="search-form__submit">Buscar</button>
    </form>

    <hr />

    <!-- 2. Mensaje de estado (Cargando / Sin resultados) -->
    <div id="status-message"></div>

    <!-- 3. Contenedor donde se cargarán las tarjetas de personajes -->
    <div id="results-container" class="results-grid"></div>

    <hr />

    <!-- 4. Controles de Paginación -->
    <div id="pagination-container" class="pagination">
      <button id="btn-prev" disabled>Anterior</button>
      <span id="page-info">Página 1</span>
      <button id="btn-next" disabled>Siguiente</button>
    </div>

  </main>

   <!-- Navegacion mobile -->
  <div id="site-nav"></div>

  <!-- Footer desktop -->
   <div id="site-footer"></div>

  <!-- Componentes: siempre antes de main.js --> 
  <script src="./js/components/bottom-nav.js"></script>
  <script src="./js/components/header.js"></script>
  <script src="./js/components/footer.js"></script>
  <script src="./js/components/card.js"></script>
    
  <!-- Utilidades -->
  <script src="./js/api/api.js"></script>
  <script src="./js/utils/router.js"></script>

  <!-- Controlador: siempre antes del script de la vista --> 
  <script src="./js/main.js"></script>

  <!-- Lógica específica de esta vista -->
   <script src="./js/pages/search.js"></script>
   <script src="./js/utils/local-storage-util.js"></script>

</body>
</html>
