<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

    <!-- Puntos de montaje para componentes comunes -->
    <div id="site-header"></div>

    <main class="main__container">
        <div id="site-shopping-cart"></div>

        <div id="site-modal"></div>

    </main>

    <!-- Navegacion mobile -->
    <div id="site-nav"></div>

    <!-- Footer desktop -->
    <div id="site-footer"></div>


    <!-- Componentes: siempre antes de main.js -->
    <script src="./js/components/bottom-nav.js"></script>
    <script src="./js/components/header.js"></script>
    <script src="./js/components/footer.js"></script>
    <script src="./js/components/cart/quantity-selector.js"></script>
    <script src="./js/components/cart/cart-item.js"></script>
    <script src="./js/components/cart/cart-header.js"></script>
    <script src="./js/components/cart/order-summary.js"></script>
    <script src="./js/components/cart/cart.js"></script>
    <script src="./js/components/order/order-modal.js"></script>

    <!-- Utilidades -->
    <script src="./js/api/api.js"></script>
    <script src="./js/utils/router.js"></script>
    <script src="./js/utils/local-storage-util.js"></script>
    <script src="./js/validators/validation-rules.js"></script>
    <script src="./js/validators/form-validator.js"></script>
    <script src="./js/validators/order-form-rules.js"></script>


    <!-- Controlador: siempre antes del script de la vista -->
    <script src="./js/main.js"></script>

    <!-- Lógica específica de esta vista -->
    <script src="./js/pages/shoppingCart.js"></script>

</body>

</html>
